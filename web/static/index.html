<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartPark AI — Sistema de reconocimiento automático de placas vehiculares en tiempo real">
    <title>SmartPark AI — Reconocimiento de Placas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__brand">
            <div class="header__icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </div>
            <div>
                <h1 class="header__title">SmartPark AI</h1>
                <p class="header__subtitle">Reconocimiento de Placas en Tiempo Real</p>
            </div>
        </div>
        <div class="header__status" id="connection-status">
            <span class="status-dot status-dot--disconnected"></span>
            <span class="status-text">Conectando...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Video Panel -->
        <section class="panel panel--video">
            <div class="panel__header">
                <h2 class="panel__title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    Cámara en Vivo
                </h2>
                <span class="badge badge--live" id="live-badge">
                    <span class="badge__dot"></span> LIVE
                </span>
            </div>
            <div class="video-container">
                <img 
                    id="video-stream" 
                    src="/stream" 
                    alt="Stream de cámara en vivo"
                    class="video-feed"
                >
                <div class="video-overlay" id="video-overlay">
                    <p>⏳ Esperando señal de cámara...</p>
                </div>
            </div>
        </section>

        <!-- Detections Panel -->
        <section class="panel panel--detections">
            <div class="panel__header">
                <h2 class="panel__title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"/>
                        <line x1="2" y1="10" x2="22" y2="10"/>
                    </svg>
                    Placas Detectadas
                </h2>
                <span class="badge badge--count" id="plate-count">0</span>
            </div>

            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat">
                    <span class="stat__value" id="stat-total">0</span>
                    <span class="stat__label">Total</span>
                </div>
                <div class="stat">
                    <span class="stat__value" id="stat-cars">0</span>
                    <span class="stat__label">Carros</span>
                </div>
                <div class="stat">
                    <span class="stat__value" id="stat-motos">0</span>
                    <span class="stat__label">Motos</span>
                </div>
                <div class="stat">
                    <span class="stat__value" id="stat-buses">0</span>
                    <span class="stat__label">Buses</span>
                </div>
            </div>

            <!-- Detection List -->
            <div class="detection-list" id="detection-list">
                <div class="empty-state" id="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <p>Esperando detecciones...</p>
                    <small>Las placas aparecerán aquí en tiempo real</small>
                </div>
            </div>
        </section>
    </main>

    <!-- Last Detection Banner -->
    <div class="last-detection" id="last-detection" hidden>
        <div class="last-detection__content">
            <span class="last-detection__label">Última placa:</span>
            <span class="last-detection__plate" id="last-plate">---</span>
            <span class="last-detection__type" id="last-type">---</span>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
